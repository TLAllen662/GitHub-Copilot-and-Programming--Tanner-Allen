<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}StreamBox{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('index') }}" class="logo">StreamBox</a>
        <form action="{{ url_for('index') }}" method="get" class="search-form">
            <input type="text" name="q" placeholder="Search videos..." value="{{ request.args.get('q', '') }}">
            <button type="submit">Search</button>
        </form>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
